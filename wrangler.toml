name = "banking"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Required: declaring any [[routes]] entry disables the workers.dev subdomain by
# default, which 404s banking.davidrecla.workers.dev. Keep this true so both
# hostnames serve the Worker. Must stay above every [table] header -- in TOML a
# bare key placed after one is parsed as belonging to that table, which fails
# the build with an unexpected-field error on routes.
workers_dev = true

[vars]
ENVIRONMENT = "production"

# Custom domain. Declared here (rather than set up in the dashboard) so the
# binding is tracked in the repo and reapplied on every deploy.
[[routes]]
pattern = "banking.puregroundscoffee.com"
custom_domain = true

[[kv_namespaces]]
binding = "BANK_KV"
id = "fa8bcc19366b4f68ac9c3ff6ebf54a0b"
# Separate namespace for `wrangler dev`, which refuses to start against the
# production KV id. Rate-limit counters written while developing land here
# instead of in production.
preview_id = "5870aa99099a4e6a99ed8301ec90df68"

[[d1_databases]]
binding = "BANK_DB"
database_name = "bank-database"
database_id = "6f12dd90-3093-4b25-adcb-a0e43ece88ac"

[[r2_buckets]]
binding = "BANK_BUCKET"
bucket_name = "bank-bucket"
# Same reason as the KV preview_id above: `wrangler dev` refuses to start
# against the production bucket, so dev uploads go here.
preview_bucket_name = "bank-bucket-preview"

[assets]
directory = "./public"
binding = "ASSETS"
