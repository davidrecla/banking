name = "banking"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ENVIRONMENT = "production"

# Custom domain. Declared here (rather than set up in the dashboard) so the
# binding is tracked in the repo and reapplied on every deploy.
[[routes]]
pattern = "banking.puregroundscoffee.com"
custom_domain = true

# Required: declaring any [[routes]] entry disables the workers.dev subdomain
# by default, which 404s banking.davidrecla.workers.dev. Keep this true so both
# hostnames serve the Worker.
workers_dev = true

[[kv_namespaces]]
binding = "BANK_KV"
id = "fa8bcc19366b4f68ac9c3ff6ebf54a0b"

[[d1_databases]]
binding = "BANK_DB"
database_name = "bank-database"
database_id = "6f12dd90-3093-4b25-adcb-a0e43ece88ac"

[[r2_buckets]]
binding = "BANK_BUCKET"
bucket_name = "bank-bucket"

[assets]
directory = "./public"
binding = "ASSETS"
